[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37"
tauri = { version = "2", features = ["image-png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1"

[lib]
name = "filemon_lib"
path = "src/lib.rs"

[package]
build = "build.rs"
description = "FileMon — Windows Explorer-style file manager for Linux"
edition = "2021"
name = "filemon"
version = "0.1.0"

[profile.release]
lto = true
opt-level = 2
